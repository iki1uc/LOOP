<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>GHOST-SCAN – Systemlage · Live‑Loop</title>
  <style>
    * { box-sizing:border-box; }
    body {
      background: #0b0b0b;
      color: #e0e0e0;
      font-family: 'Consolas', monospace;
      padding: 20px;
      margin: 0;
    }
    h1 {
      color: #6cf;
      text-align: center;
      font-size: 1.6rem;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      color: #5a7a8a;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .respo-card {
      background: #111;
      border: 1px solid #2a3a4a;
      border-radius: 8px;
      padding: 12px;
      transition: border-color 0.3s;
    }
    .respo-card h2 {
      font-size: 16px;
      margin: 0 0 6px 0;
      border-bottom: 1px solid #1a2226;
      padding-bottom: 4px;
    }
    .respo-card .detail {
      font-size: 12px;
      color: #8ab0c0;
      line-height: 1.5;
    }
    .respo-card .detail span {
      color: #e0e0e0;
    }
    .status-ok { border-color: #00ff88; }
    .status-ok h2 { color: #00ff88; }
    .status-help { border-color: #ffcc00; }
    .status-help h2 { color: #ffcc00; }
    .status-error { border-color: #ff4444; }
    .status-error h2 { color: #ff4444; }
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #5a7a8a;
      border-top: 1px solid #1a2226;
      padding-top: 10px;
    }
    .footer .live { color: #00ff88; font-weight: bold; }
  </style>
</head>
<body>

  <h1>👻 GHOST‑SCAN · Systemlage</h1>
  <div class="sub">🔄 Live‑Loop · alle 3 Sekunden · paralleles Laden</div>

  <div id="grid" class="grid"></div>
  <div id="statusLine" class="footer">⏳ Lade …</div>

  <script>
    "use strict";

    // ─── RESPO‑Liste ──────────────────────────────────────────────
    const RESPO_NAMES = [
      "AIR","boerse","markt3","HOME","USE",
      "ACSH","REAL","BIL","DU","NG"
    ];

    // ─── DOM‑Refs ──────────────────────────────────────────────────
    const grid = document.getElementById('grid');
    const statusLine = document.getElementById('statusLine');

    // ─── Lade‑Funktion (parallel) ─────────────────────────────────
    async function loadAllRespos() {
      // Alle Respos parallel anfordern – viel schneller als sequenziell
      const promises = RESPO_NAMES.map(async (name) => {
        try {
          const res = await fetch(`/RESPO/${name}.json`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          return { ...data, NAME: name, MISS: false };
        } catch (err) {
          // Fallback: Fehler als "missing" markieren
          return { NAME: name, MISS: true, ERROR: err.message };
        }
      });

      // Auf alle Antworten warten
      const results = await Promise.all(promises);
      return results;
    }

    // ─── Renderer ──────────────────────────────────────────────────
    function renderScan(respos) {
      grid.innerHTML = '';

      respos.forEach(r => {
        const card = document.createElement('div');
        card.className = 'respo-card';

        // Status‑Klasse bestimmen
        let statusClass = 'status-ok';
        if (r.MISS || r.ERROR) statusClass = 'status-error';
        else if (r.STATUS === 'HELFEN' || r.RESULT === 'HELFEN') statusClass = 'status-help';

        card.classList.add(statusClass);

        // Inhalte sicher ausgeben
        const id = r.ID ?? '—';
        const raum = r.RAUM ? JSON.stringify(r.RAUM) : '(keine LAGE)';
        const status = r.STATUS ?? (r.MISS ? 'MISSING' : 'UNKNOWN');
        const result = r.RESULT ?? '—';

        card.innerHTML = `
          <h2>${r.NAME}</h2>
          <div class="detail">
            <div><b>ID:</b> <span>${id}</span></div>
            <div><b>LAGE:</b> <span>${raum}</span></div>
            <div><b>STATUS:</b> <span>${status}</span></div>
            <div><b>RESULT:</b> <span>${result}</span></div>
            ${r.MISS ? '<div style="color:#ff4444;">⚠️ Datei nicht gefunden</div>' : ''}
            ${r.ERROR ? `<div style="color:#ff4444;">❌ ${r.ERROR}</div>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });

      // Statuszeile aktualisieren
      const now = new Date().toLocaleTimeString();
      const ok = respos.filter(r => !r.MISS && !r.ERROR).length;
      const total = respos.length;
      statusLine.innerHTML = `
        <span class="live">●</span> Letzter Scan: ${now} · 
        <span style="color:#00ff88;">${ok}</span> / ${total} Respos verfügbar
        <span style="margin-left:12px;color:#5a7a8a;">(Loop alle 3s)</span>
      `;
    }

    // ─── Haupt‑Loop (wird periodisch ausgeführt) ──────────────────
    async function scanLoop() {
      try {
        const respos = await loadAllRespos();
        renderScan(respos);
      } catch (err) {
        statusLine.innerHTML = `❌ Fehler im Scan‑Loop: ${err.message}`;
        console.error(err);
      }
    }

    // ─── Start ────────────────────────────────────────────────────
    // Sofort einmal scannen, dann alle 3 Sekunden wiederholen
    scanLoop();
    setInterval(scanLoop, 3000);
  </script>

</body>
</html>
