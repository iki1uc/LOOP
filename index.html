<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>GHOST-SCAN – Systemlage · FINAL</title>
  <style>
    * { box-sizing:border-box; }
    body {
      background: #0b0b0b;
      color: #e0e0e0;
      font-family: 'Consolas', monospace;
      padding: 20px;
      margin: 0;
    }
    h1 {
      color: #6cf;
      text-align: center;
      font-size: 1.6rem;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      color: #5a7a8a;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .respo-card {
      background: #111;
      border: 1px solid #2a3a4a;
      border-radius: 8px;
      padding: 12px;
      transition: border-color 0.3s;
    }
    .respo-card h2 {
      font-size: 16px;
      margin: 0 0 6px 0;
      border-bottom: 1px solid #1a2226;
      padding-bottom: 4px;
    }
    .respo-card .detail {
      font-size: 12px;
      color: #8ab0c0;
      line-height: 1.5;
    }
    .respo-card .detail span {
      color: #e0e0e0;
    }
    .status-ok { border-color: #00ff88; }
    .status-ok h2 { color: #00ff88; }
    .status-help { border-color: #ffcc00; }
    .status-help h2 { color: #ffcc00; }
    .status-error { border-color: #ff4444; }
    .status-error h2 { color: #ff4444; }
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #5a7a8a;
      border-top: 1px solid #1a2226;
      padding-top: 10px;
    }
    .footer .live { color: #00ff88; font-weight: bold; }
  </style>
</head>
<body>

  <h1>👻 GHOST‑SCAN · Systemlage</h1>
  <div class="sub">🔄 Live‑Loop · alle 3 Sekunden · paralleles Laden · Fixpunkt + ROLL‑OVER</div>

  <div id="grid" class="grid"></div>
  <div id="statusLine" class="footer">⏳ Lade …</div>

  <script>
    "use strict";

    // ─── RESPO‑Liste ──────────────────────────────────────────────
    const RESPO_NAMES = [
      "AIR","boerse","markt3","HOME","USE",
      "ACSH","REAL","BIL","DU","NG"
    ];

    // ─── DOM‑Refs ──────────────────────────────────────────────────
    const grid = document.getElementById('grid');
    const statusLine = document.getElementById('statusLine');

    // ─── Lade‑Funktion (parallel) ─────────────────────────────────
    async function loadAllRespos() {
      const promises = RESPO_NAMES.map(async (name) => {
        try {
          const res = await fetch(`/RESPO/${name}.json`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          return { ...data, NAME: name, MISS: false };
        } catch (err) {
          return { NAME: name, MISS: true, ERROR: err.message };
        }
      });

      return Promise.all(promises);
    }

    // ─── Fixpunkt berechnen ───────────────────────────────────────
    function computeFixpoint(respos) {
      const flat = respos.flatMap(r => r.OUT || []).map(Number).filter(x => !isNaN(x));
      if (!flat.length) return 0.777;
      const avg = flat.reduce((a,b)=>a+b,0) / flat.length;
      return Number(((avg + 0.777) / 2).toFixed(3));
    }

    // ─── LOOP‑Objekt ───────────────────────────────────────────────
    function loopReturn(fix) {
      return {
        LOOP: true,
        FIX: fix,
        TIME: Date.now(),
        STATE: fix > 0.7 ? "STABIL" : "LOW",
        NEXT: Number((fix * 1.11).toFixed(3))
      };
    }

    // ─── ROLL‑OVER ────────────────────────────────────────────────
    function applyRollOver(loop) {
      document.querySelectorAll(".respo-card").forEach(card => {
        const extra = document.createElement("div");
        extra.style.color = "#88f";
        extra.style.fontSize = "11px";
        extra.innerHTML = `<b>LOOP-FIX:</b> ${loop.FIX} · <b>STATE:</b> ${loop.STATE}`;
        card.appendChild(extra);
      });
    }

    // ─── Renderer ──────────────────────────────────────────────────
    function renderScan(respos) {
      grid.innerHTML = '';

      respos.forEach(r => {
        const card = document.createElement('div');
        card.className = 'respo-card';

        let statusClass = 'status-ok';
        if (r.MISS || r.ERROR) statusClass = 'status-error';
        else if (r.STATUS === 'HELFEN' || r.RESULT === 'HELFEN') statusClass = 'status-help';

        card.classList.add(statusClass);

        const id = r.ID ?? '—';
        const raum = r.RAUM ? JSON.stringify(r.RAUM) : '(keine LAGE)';
        const status = r.STATUS ?? (r.MISS ? 'MISSING' : 'UNKNOWN');
        const result = r.RESULT ?? '—';

        card.innerHTML = `
          <h2>${r.NAME}</h2>
          <div class="detail">
            <div><b>ID:</b> <span>${id}</span></div>
            <div><b>LAGE:</b> <span>${raum}</span></div>
            <div><b>STATUS:</b> <span>${status}</span></div>
            <div><b>RESULT:</b> <span>${result}</span></div>
            ${r.MISS ? '<div style="color:#ff4444;">⚠️ Datei nicht gefunden</div>' : ''}
            ${r.ERROR ? `<div style="color:#ff4444;">❌ ${r.ERROR}</div>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // ─── Haupt‑Loop ────────────────────────────────────────────────
    async function scanLoop() {
      try {
        const respos = await loadAllRespos();
        renderScan(respos);

        const fix = computeFixpoint(respos);
        const loop = loopReturn(fix);

        applyRollOver(loop);

        const now = new Date().toLocaleTimeString();
        const ok = respos.filter(r => !r.MISS && !r.ERROR).length;
        const total = respos.length;

        statusLine.innerHTML = `
          <span class="live">●</span> Scan: ${now} · 
          <span style="color:#00ff88;">${ok}</span> / ${total} Respos · 
          Fixpunkt: <span style="color:#6cf;">${loop.FIX}</span>
        `;

      } catch (err) {
        statusLine.innerHTML = `❌ Fehler im Loop: ${err.message}`;
      }
    }

    // ─── Start ────────────────────────────────────────────────────
    scanLoop();
    setInterval(scanLoop, 3000);
  </script>

</body>
</html>
